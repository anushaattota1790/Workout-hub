<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Print Layout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Day 5 - Glutes + Core + Mobility</h1>
    </header>

    <section class="exercise-block">
      <div class="exercise-title-row">
        <div class="thumb thumb-1" aria-hidden="true"></div>
        <h2 class="exercise-title is-accent">Banded Hip Extensions</h2>
        <a class="yt-link" href="https://www.youtube.com/watch?v=JIJ-qyUJE4s" target="_blank" rel="noopener noreferrer">▶ Watch</a>
      </div>

      <div class="table-wrap">
        <div class="grid header-row">
          <div class="set-col">Set</div>
          <div class="field-cell">Weight - kg</div>
          <div class="field-cell">Reps</div>
          <div class="field-cell">Rest Time</div>
        </div>

        <div class="grid data-row">
          <div class="set-col">1</div>
          <div class="field-cell with-unit">1 <span>kg</span></div>
          <div class="field-cell">12</div>
          <div class="rest-group">
            <div class="field-cell">M: 0</div>
            <div class="field-cell">S: 30</div>
          </div>
        </div>

        <div class="grid data-row">
          <div class="set-col">2</div>
          <div class="field-cell with-unit">1 <span>kg</span></div>
          <div class="field-cell">12</div>
          <div class="rest-group">
            <div class="field-cell">M: 0</div>
            <div class="field-cell">S: 30</div>
          </div>
        </div>
      </div>
    </section>

    <section class="exercise-block">
      <div class="exercise-title-row">
        <div class="thumb thumb-2" aria-hidden="true"></div>
        <h2 class="exercise-title">Standing Hip Circles</h2>
        <a class="yt-link" href="https://www.youtube.com/watch?v=J99HfZjMzL8" target="_blank" rel="noopener noreferrer">▶ Watch</a>
      </div>

      <div class="table-wrap">
        <div class="grid header-row">
          <div class="set-col">Set</div>
          <div class="field-cell">Bodyweight</div>
          <div class="field-cell">Reps</div>
          <div class="field-cell">Rest Time</div>
        </div>

        <div class="grid data-row">
          <div class="set-col">1</div>
          <div class="field-cell"></div>
          <div class="field-cell">10</div>
          <div class="rest-group">
            <div class="field-cell">M: 0</div>
            <div class="field-cell">S: 30</div>
          </div>
        </div>
      </div>
    </section>

    <section class="exercise-block minimal">
      <div class="exercise-title-row">
        <div class="thumb thumb-3" aria-hidden="true"></div>
        <h2 class="exercise-title">hamstring wall slides</h2>
        <a class="yt-link" href="https://www.youtube.com/@MyPTHub/search?query=wall%20slides" target="_blank" rel="noopener noreferrer">▶ Search</a>
      </div>
    </section>
  </main>
</body>
</html>
